<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#ffffff"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="週課表"/>
<meta name="description" content="手機週課表 PWA"/>
<title>週課表</title>
<link rel="manifest" id="manifest-placeholder"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#fff;--bg2:#f5f5f7;--bg3:#ebebed;
  --text:#111;--text2:#666;--text3:#aaa;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --radius:12px;--safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
  --text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
}}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Hiragino Sans GB',sans-serif;}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
/* Layout */
#app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;width:100%;}
.header{
  padding:calc(var(--safe-top) + 12px) 16px 10px;
  background:var(--bg);
  border-bottom:0.5px solid var(--border);
  flex-shrink:0;
}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.header-title{font-size:20px;font-weight:600;color:var(--text);}
.header-sub{font-size:12px;color:var(--text2);}
.btn-add{
  width:32px;height:32px;border-radius:50%;
  background:var(--text);border:none;
  color:var(--bg);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  line-height:1;font-weight:300;
}
.week-nav-row{display:flex;align-items:center;gap:6px;}
.week-arrow{
  width:28px;height:28px;border:0.5px solid var(--border2);
  background:var(--bg2);border-radius:50%;
  color:var(--text);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0;line-height:1;
}
.week-label{font-size:13px;color:var(--text2);flex:1;text-align:center;}
/* Legend */
.legend{
  display:flex;gap:6px;flex-wrap:wrap;
  padding:6px 14px;
  border-bottom:0.5px solid var(--border);
  flex-shrink:0;
  background:var(--bg);
}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
/* Grid */
.grid-wrap{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg);}
.grid{
  display:grid;
  grid-template-columns:38px repeat(5,minmax(0,1fr));
  width:100%;
}
.day-header{
  padding:6px 2px;text-align:center;
  font-size:11px;font-weight:500;
  border-bottom:0.5px solid var(--border);
  background:var(--bg);
  position:sticky;top:0;z-index:2;
}
.day-header .dname{color:var(--text2);display:block;font-size:10px;margin-bottom:1px;}
.day-header .dnum{
  color:var(--text);font-size:14px;font-weight:600;display:inline-block;
  width:26px;height:26px;line-height:26px;border-radius:50%;
}
.day-header.today .dnum{background:var(--text);color:var(--bg);}
.time-col{
  font-size:9px;color:var(--text3);
  text-align:right;padding:3px 4px 0 0;
  border-bottom:0.5px solid var(--border);
  min-height:54px;
}
.cell{
  border-bottom:0.5px solid var(--border);
  border-left:0.5px solid var(--border);
  min-height:54px;padding:2px;position:relative;
}
.cls{
  border-radius:8px;padding:4px 5px;
  font-size:10px;cursor:pointer;
  display:flex;flex-direction:column;gap:1px;
  transition:opacity .15s;
}
.cls:active{opacity:.7;}
.cls .cname{font-weight:600;font-size:10px;line-height:1.3;}
.cls .croom{font-size:9px;opacity:.72;line-height:1.2;}
.cls-blue{background:#E6F1FB;color:#0C447C;}
.cls-green{background:#EAF3DE;color:#27500A;}
.cls-amber{background:#FAEEDA;color:#633806;}
.cls-purple{background:#EEEDFE;color:#3C3489;}
.cls-red{background:#FCEBEB;color:#791F1F;}
.cls-teal{background:#E1F5EE;color:#085041;}
.cls-pink{background:#FBEAF0;color:#72243E;}
@media(prefers-color-scheme:dark){
  .cls-blue{background:#0C2040;color:#85B7EB;}
  .cls-green{background:#1A2E0A;color:#97C459;}
  .cls-amber{background:#2A1E05;color:#EF9F27;}
  .cls-purple{background:#1E1A40;color:#AFA9EC;}
  .cls-red{background:#2A0A0A;color:#F09595;}
  .cls-teal{background:#0A2018;color:#5DCAA5;}
  .cls-pink{background:#2A1020;color:#ED93B1;}
}
/* Bottom nav */
.bottom-nav{
  display:flex;border-top:0.5px solid var(--border);
  background:var(--bg);padding-bottom:var(--safe-bottom);
  flex-shrink:0;
}
.nav-item{
  flex:1;padding:10px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;border:none;background:transparent;color:var(--text2);
}
.nav-item.active{color:var(--text);}
.nav-label{font-size:10px;}
.nav-item.active .nav-label{font-weight:600;}
/* Install banner */
#install-banner{
  display:none;align-items:center;gap:10px;
  padding:10px 14px;background:var(--bg2);
  border-bottom:0.5px solid var(--border);
  flex-shrink:0;
}
#install-banner.show{display:flex;}
.install-icon{
  width:36px;height:36px;border-radius:8px;
  background:var(--text);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.install-text{flex:1;}
.install-title{font-size:13px;font-weight:600;color:var(--text);}
.install-sub{font-size:11px;color:var(--text2);}
.btn-install{
  padding:6px 14px;background:var(--text);color:var(--bg);
  border:none;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;
  white-space:nowrap;
}
.btn-dismiss{
  padding:4px;background:transparent;border:none;
  color:var(--text3);font-size:18px;cursor:pointer;line-height:1;
}
/* iOS hint */
#ios-hint{
  display:none;padding:10px 14px;
  background:var(--bg2);border-bottom:0.5px solid var(--border);
  font-size:12px;color:var(--text2);line-height:1.6;
  flex-shrink:0;
}
#ios-hint.show{display:block;}
/* Modal */
.modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.4);z-index:100;
  align-items:flex-end;justify-content:center;
}
.modal-bg.show{display:flex;}
.modal{
  background:var(--bg);width:100%;max-width:430px;
  border-radius:20px 20px 0 0;
  padding:16px 18px calc(var(--safe-bottom) + 16px);
  max-height:90vh;overflow-y:auto;
}
.modal-handle{width:32px;height:3px;background:var(--border2);border-radius:2px;margin:0 auto 14px;}
.mtitle{font-size:16px;font-weight:600;margin-bottom:14px;color:var(--text);}
.frow{margin-bottom:12px;}
.flabel{font-size:12px;color:var(--text2);margin-bottom:4px;display:block;}
.finput{
  width:100%;padding:8px 12px;
  border:0.5px solid var(--border2);border-radius:10px;
  font-size:14px;background:var(--bg2);color:var(--text);
  font-family:inherit;-webkit-appearance:none;
}
.day-checks{display:flex;gap:6px;flex-wrap:wrap;}
.dcheck{
  padding:5px 12px;border-radius:20px;font-size:12px;
  border:0.5px solid var(--border2);cursor:pointer;
  color:var(--text2);background:transparent;
  transition:background .12s,color .12s;
}
.dcheck.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.colors{display:flex;gap:8px;margin-top:4px;}
.cdot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:border-color .1s;}
.cdot.sel{border-color:var(--text);}
.mactions{display:flex;gap:8px;margin-top:14px;}
.mbtn-c{flex:1;padding:10px;border:0.5px solid var(--border2);border-radius:10px;background:transparent;color:var(--text2);font-size:14px;cursor:pointer;font-family:inherit;}
.mbtn-s{flex:2;padding:10px;border:none;border-radius:10px;background:var(--text);color:var(--bg);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div id="app">
  <div id="install-banner">
    <div class="install-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
    </div>
    <div class="install-text">
      <div class="install-title">加入桌面</div>
      <div class="install-sub">隨時快速開啟週課表</div>
    </div>
    <button class="btn-install" id="btn-install">安裝</button>
    <button class="btn-dismiss" id="btn-dismiss">×</button>
  </div>
  <div id="ios-hint">
    點擊 Safari 底部的 <strong>分享按鈕</strong>（方框+箭頭），再選「<strong>加入主畫面</strong>」即可安裝到桌面。
  </div>
  <div class="header">
    <div class="header-row">
      <div>
        <div class="header-title">週課表</div>
        <div class="header-sub">2026 第二學期</div>
      </div>
      <button class="btn-add" onclick="openModal()">+</button>
    </div>
    <div class="week-nav-row">
      <button class="week-arrow" onclick="changeWeek(-1)">&#8249;</button>
      <span class="week-label" id="week-label"></span>
      <button class="week-arrow" onclick="changeWeek(1)">&#8250;</button>
    </div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-item active">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="14" height="13" rx="2"/><path d="M6 1v4M12 1v4M2 8h14"/></svg>
      <span class="nav-label">課表</span>
    </button>
    <button class="nav-item">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h10v10H4zM4 8h10M8 4v10"/></svg>
      <span class="nav-label">作業</span>
    </button>
    <button class="nav-item">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 14l3-4 3 2 3-5 3 3"/></svg>
      <span class="nav-label">成績</span>
    </button>
    <button class="nav-item">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="6" r="3"/><path d="M3 16c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>
      <span class="nav-label">我的</span>
    </button>
  </div>
</div>

<!-- Add class modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="mtitle">新增課程</div>
    <div class="frow">
      <label class="flabel">課程名稱</label>
      <input class="finput" id="in-name" placeholder="例：微積分"/>
    </div>
    <div class="frow">
      <label class="flabel">教室</label>
      <input class="finput" id="in-room" placeholder="例：理學院 101"/>
    </div>
    <div class="frow">
      <label class="flabel">時間（節次）</label>
      <div style="display:flex;gap:8px;">
        <select class="finput" id="in-start" style="flex:1;"></select>
        <select class="finput" id="in-end" style="flex:1;"></select>
      </div>
    </div>
    <div class="frow">
      <label class="flabel">星期（可多選）</label>
      <div class="day-checks" id="day-checks"></div>
    </div>
    <div class="frow">
      <label class="flabel">顏色</label>
      <div class="colors" id="color-picks"></div>
    </div>
    <div class="mactions">
      <button class="mbtn-c" onclick="closeModal()">取消</button>
      <button class="mbtn-s" onclick="saveClass()">新增課程</button>
    </div>
  </div>
</div>

<script>
// ── PWA: inject manifest inline ──────────────────────────────────────────
const manifestData = {
  name: '週課表',
  short_name: '課表',
  description: '手機週課表 APP',
  start_url: './',
  display: 'standalone',
  background_color: '#ffffff',
  theme_color: '#ffffff',
  orientation: 'portrait',
  icons: [
    { src: makeIcon(192), sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
    { src: makeIcon(512), sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
  ]
};

function makeIcon(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#111111';
  ctx.beginPath();
  const r = size * 0.18;
  ctx.roundRect(0, 0, size, size, r);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  const s = size * 0.5, x = (size - s) / 2, y = (size - s) / 2;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = size * 0.055;
  ctx.strokeRect(x, y + size*0.04, s, s * 0.85);
  ctx.fillRect(x + s*0.2, y - size*0.02, size*0.055, size*0.12);
  ctx.fillRect(x + s*0.65, y - size*0.02, size*0.055, size*0.12);
  ctx.fillRect(x, y + s*0.3, s, size*0.055);
  return c.toDataURL('image/png');
}

const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/manifest+json'});
document.getElementById('manifest-placeholder').href = URL.createObjectURL(blob);

// ── Service Worker ───────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'schedule-v1';
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', './index.html'])));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
  ));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('./'))));
});`;
  const swBlob = new Blob([swCode], {type: 'text/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}

// ── PWA Install prompt ───────────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});
document.getElementById('btn-install').onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome} = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('show');
};
document.getElementById('btn-dismiss').onclick = () => {
  document.getElementById('install-banner').classList.remove('show');
};
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').classList.remove('show');
});

// Detect iOS Safari (no beforeinstallprompt support)
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isInStandalone = window.navigator.standalone === true;
if (isIOS && !isInStandalone) {
  document.getElementById('ios-hint').classList.add('show');
}

// ── App Data ─────────────────────────────────────────────────────────────
const DAYS = ['一','二','三','四','五'];
const PERIODS = [
  {label:'第1節',time:'08:10'},{label:'第2節',time:'09:10'},
  {label:'第3節',time:'10:10'},{label:'第4節',time:'11:10'},
  {label:'第5節',time:'12:10'},{label:'第6節',time:'13:10'},
  {label:'第7節',time:'14:10'},{label:'第8節',time:'15:10'},
  {label:'第9節',time:'16:10'},{label:'第10節',time:'17:10'},
];
const COLORS = [
  {key:'blue',dot:'#378ADD'},{key:'purple',dot:'#7F77DD'},
  {key:'green',dot:'#639922'},{key:'amber',dot:'#BA7517'},
  {key:'red',dot:'#E24B4A'},{key:'teal',dot:'#1D9E75'},
  {key:'pink',dot:'#D4537E'},
];
const DEFAULT = [
  {name:'線性代數',room:'理學院 201',start:0,end:1,days:[0,2],color:'blue'},
  {name:'英文寫作',room:'語言中心 302',start:2,end:3,days:[0,4],color:'green'},
  {name:'資料結構',room:'工學院 410',start:5,end:6,days:[0,2],color:'purple'},
  {name:'微積分',room:'理學院 101',start:1,end:2,days:[1,3],color:'amber'},
  {name:'普通物理',room:'物理館 B1',start:6,end:7,days:[1],color:'red'},
  {name:'程式設計',room:'電算中心 301',start:5,end:7,days:[2,4],color:'teal'},
  {name:'通識：音樂',room:'藝術館 G01',start:8,end:9,days:[2],color:'pink'},
];

let classes = JSON.parse(localStorage.getItem('schedule-classes') || JSON.stringify(DEFAULT));
let selColor = 'blue', selDays = [], weekOffset = 0;
const BASE = new Date(2026, 3, 13);

function saveData() { localStorage.setItem('schedule-classes', JSON.stringify(classes)); }

function getWeekLabel() {
  const s = new Date(BASE); s.setDate(s.getDate() + weekOffset * 7);
  const e = new Date(s); e.setDate(e.getDate() + 4);
  return (s.getMonth()+1)+'/'+s.getDate()+' – '+(e.getMonth()+1)+'/'+e.getDate();
}
function changeWeek(d) { weekOffset += d; document.getElementById('week-label').textContent = getWeekLabel(); renderGrid(); }

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const weekStart = new Date(BASE); weekStart.setDate(weekStart.getDate() + weekOffset * 7);
  // corner
  const corner = document.createElement('div'); corner.className = 'day-header'; grid.appendChild(corner);
  DAYS.forEach((d, i) => {
    const dt = new Date(weekStart); dt.setDate(dt.getDate() + i);
    const isToday = weekOffset === 0 && i === 0;
    const el = document.createElement('div');
    el.className = 'day-header' + (isToday ? ' today' : '');
    el.innerHTML = `<span class="dname">${d}</span><span class="dnum">${dt.getDate()}</span>`;
    grid.appendChild(el);
  });
  PERIODS.forEach((p, pi) => {
    const tl = document.createElement('div'); tl.className = 'time-col'; tl.textContent = p.time; grid.appendChild(tl);
    DAYS.forEach((_, di) => {
      const cell = document.createElement('div'); cell.className = 'cell';
      const matching = classes.filter(c => c.days.includes(di) && pi >= c.start && pi <= c.end);
      if (matching.length) {
        const c = matching[0];
        if (pi === c.start) {
          const card = document.createElement('div');
          card.className = 'cls cls-' + c.color;
          card.style.minHeight = ((c.end - c.start + 1) * 54 - 4) + 'px';
          card.innerHTML = `<span class="cname">${c.name}</span><span class="croom">${c.room}</span>`;
          cell.appendChild(card);
        } else { cell.style.padding = '0'; }
      }
      grid.appendChild(cell);
    });
  });
  renderLegend();
}

function renderLegend() {
  const seen = {};
  classes.forEach(c => { seen[c.name] = c.color; });
  const leg = document.getElementById('legend');
  leg.innerHTML = '';
  Object.entries(seen).forEach(([name, color]) => {
    const col = COLORS.find(c => c.key === color);
    const el = document.createElement('div'); el.className = 'legend-item';
    el.innerHTML = `<div class="legend-dot" style="background:${col ? col.dot : '#888'}"></div>${name}`;
    leg.appendChild(el);
  });
}

function openModal() {
  document.getElementById('modal').classList.add('show');
  document.getElementById('in-name').value = '';
  document.getElementById('in-room').value = '';
  selDays = []; selColor = 'blue';
  buildModalForm();
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

function buildModalForm() {
  const ss = document.getElementById('in-start'), se = document.getElementById('in-end');
  ss.innerHTML = ''; se.innerHTML = '';
  PERIODS.forEach((p, i) => {
    ss.innerHTML += `<option value="${i}">${p.label} ${p.time}</option>`;
    se.innerHTML += `<option value="${i}"${i===1?' selected':''}>${p.label} ${p.time}</option>`;
  });
  const dc = document.getElementById('day-checks'); dc.innerHTML = '';
  DAYS.forEach((d, i) => {
    const el = document.createElement('div'); el.className = 'dcheck'; el.textContent = '週' + d;
    el.onclick = () => { el.classList.toggle('on'); if (selDays.includes(i)) selDays = selDays.filter(x => x !== i); else selDays.push(i); };
    dc.appendChild(el);
  });
  const cp = document.getElementById('color-picks'); cp.innerHTML = '';
  COLORS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'cdot' + (c.key === selColor ? ' sel' : '');
    el.style.background = c.dot;
    el.onclick = () => { selColor = c.key; document.querySelectorAll('.cdot').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); };
    cp.appendChild(el);
  });
}

function saveClass() {
  const name = document.getElementById('in-name').value.trim();
  const room = document.getElementById('in-room').value.trim();
  const start = parseInt(document.getElementById('in-start').value);
  const end = parseInt(document.getElementById('in-end').value);
  if (!name || !selDays.length) { alert('請填寫課程名稱並選擇至少一天'); return; }
  classes.push({name, room: room || '未指定', start: Math.min(start,end), end: Math.max(start,end), days: [...selDays], color: selColor});
  saveData();
  closeModal();
  renderGrid();
}

// Close modal on bg click
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

document.getElementById('week-label').textContent = getWeekLabel();
renderGrid();
</script>
