<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111111"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="今日課表"/>
<title>今日課表</title>
<link rel="manifest" id="mf"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Hiragino Sans GB',sans-serif;
  background:#111;color:#f2f2f7;
  overflow:hidden;
}
.app{
  display:flex;flex-direction:column;height:100%;
  max-width:430px;margin:0 auto;
  padding:calc(var(--safe-top)+16px) 16px calc(var(--safe-bottom)+16px);
}
.top-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.day-label{font-size:13px;font-weight:500;color:#aeaeb2;}
.date-label{font-size:28px;font-weight:700;color:#f2f2f7;line-height:1.1;}
.open-btn{
  font-size:12px;color:#aeaeb2;
  background:rgba(255,255,255,0.1);
  border:none;border-radius:14px;padding:5px 12px;cursor:pointer;
  font-family:inherit;
  text-decoration:none;display:flex;align-items:center;gap:4px;
}
.classes-list{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.class-row{
  display:flex;align-items:stretch;gap:10px;
  background:rgba(255,255,255,0.07);
  border-radius:14px;padding:12px 14px;
}
.class-row.current{background:rgba(255,255,255,0.13);border:0.5px solid rgba(255,255,255,0.2);}
.class-row.done{opacity:.45;}
.time-col{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:44px;flex-shrink:0;}
.time-start{font-size:14px;font-weight:600;}
.time-end{font-size:11px;color:#636366;}
.divider{width:0.5px;background:rgba(255,255,255,0.15);margin:0 2px;}
.info-col{flex:1;display:flex;flex-direction:column;gap:3px;justify-content:center;}
.cls-name{font-size:14px;font-weight:600;}
.cls-room{font-size:12px;color:#aeaeb2;}
.color-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#636366;}
.empty-icon{font-size:40px;opacity:.4;}
.empty-text{font-size:15px;}
.now-line{height:1px;background:rgba(255,59,48,0.6);margin:0 -2px;position:relative;}
.now-dot{width:7px;height:7px;background:#FF3B30;border-radius:50%;position:absolute;top:-3px;left:-2px;}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.status-ongoing{background:#30D158;}
.status-upcoming{background:#636366;}
.status-done{background:transparent;border:1px solid #636366;}

/* Color bars */
.bar-blue{background:#378ADD;} .bar-purple{background:#7F77DD;} .bar-green{background:#639922;}
.bar-amber{background:#BA7517;} .bar-red{background:#E24B4A;} .bar-teal{background:#1D9E75;}
.bar-pink{background:#D4537E;} .bar-orange{background:#FF9500;} .bar-yellow{background:#FFCC00;}
.bar-cyan{background:#00BCD4;} .bar-gray{background:#9E9E9E;} .bar-indigo{background:#3F51B5;}
.bar-lime{background:#CDDC39;} .bar-brown{background:#795548;}
</style>
</head>
<body>
<div class="app">
  <div class="top-row">
    <div>
      <div class="day-label" id="day-label"></div>
      <div class="date-label" id="date-label"></div>
    </div>
    <a class="open-btn" href="./index.html">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="12" height="12" rx="3"/><path d="M5 7h4M7 5l2 2-2 2"/></svg>
      開啟課表
    </a>
  </div>
  <div class="classes-list" id="classes-list"></div>
</div>

<script>
// Manifest & PWA
function makeIcon(sz){
  const c=document.createElement('canvas');c.width=c.height=sz;
  const x=c.getContext('2d');
  x.fillStyle='#111';x.beginPath();x.roundRect(0,0,sz,sz,sz*.18);x.fill();
  // Clock icon
  x.strokeStyle='#fff';x.lineWidth=sz*.06;x.beginPath();x.arc(sz/2,sz/2,sz*.28,0,Math.PI*2);x.stroke();
  x.beginPath();x.moveTo(sz/2,sz*.3);x.lineTo(sz/2,sz/2);x.lineTo(sz*.65,sz*.6);x.stroke();
  return c.toDataURL();
}
const mfd={name:'今日課表',short_name:'今日課',start_url:'./widget.html',display:'standalone',background_color:'#111111',theme_color:'#111111',orientation:'portrait',icons:[{src:makeIcon(192),sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:makeIcon(512),sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
document.getElementById('mf').href=URL.createObjectURL(new Blob([JSON.stringify(mfd)],{type:'application/manifest+json'}));

// Read data from shared localStorage (same origin as index.html)
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}

const DAYS_ZH=['日','一','二','三','四','五','六'];
const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const COLORS_DOT={blue:'#378ADD',purple:'#7F77DD',green:'#639922',amber:'#BA7517',red:'#E24B4A',teal:'#1D9E75',pink:'#D4537E',orange:'#FF9500',yellow:'#FFCC00',cyan:'#00BCD4',gray:'#9E9E9E',indigo:'#3F51B5',lime:'#CDDC39',brown:'#795548'};

const now=new Date();
const dow=now.getDay(); // 0=Sun,6=Sat
const dayIdx=dow===0?6:dow-1; // 0=Mon…6=Sun

// Header
document.getElementById('day-label').textContent='星期'+DAYS_ZH[dow]+' · '+MONTHS[now.getMonth()];
document.getElementById('date-label').textContent=now.getDate()+'日';

// Load schedule
const semesters=ld('semesters',{});
const currentSemester=ld('currentSemester','預設');
const semData=semesters[currentSemester]||semesters['預設']||{courses:[]};
const classes=semData.courses||[];

const DEFAULT_PERIODS=[
  {label:'第1節',time:'08:00'},{label:'第2節',time:'08:50'},{label:'第3節',time:'09:40'},
  {label:'第4節',time:'10:30'},{label:'第5節',time:'11:20'},{label:'第6節',time:'12:10'},
  {label:'第7節',time:'13:00'},{label:'第8節',time:'13:50'},
];
const PERIODS=ld('periods',DEFAULT_PERIODS);

function timeToMin(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
const nowMin=now.getHours()*60+now.getMinutes();

const todayClasses=classes
  .filter(c=>c.days.includes(dayIdx))
  .map(c=>({
    ...c,
    startTime:c.customStartTime||PERIODS[c.start]?.time||'00:00',
    endTime:c.customEndTime||PERIODS[c.end]?.time||'00:00',
    startMin:timeToMin(c.customStartTime||PERIODS[c.start]?.time||'00:00'),
    endMin:timeToMin(c.customEndTime||PERIODS[c.end]?.time||'00:00')+50,
  }))
  .sort((a,b)=>a.startMin-b.startMin);

const list=document.getElementById('classes-list');

if(!todayClasses.length){
  list.innerHTML=`
    <div class="empty-state">
      <div class="empty-icon">🎉</div>
      <div class="empty-text">${dow===0||dow===6?'今天是假日':'今天沒有課'}</div>
    </div>`;
} else {
  todayClasses.forEach((c,i)=>{
    const isDone=nowMin>c.endMin;
    const isCurrent=nowMin>=c.startMin&&nowMin<=c.endMin;
    const row=document.createElement('div');
    row.className='class-row'+(isCurrent?' current':'')+(isDone?' done':'');
    const dotColor=COLORS_DOT[c.color]||'#888';
    row.innerHTML=`
      <div class="color-bar bar-${c.color}"></div>
      <div class="time-col">
        <span class="time-start">${c.startTime}</span>
        <span class="time-end">${c.endTime}</span>
      </div>
      <div class="divider"></div>
      <div class="info-col">
        <div class="cls-name">${c.name}</div>
        <div class="cls-room">${c.room}</div>
      </div>
      <div class="status-dot ${isCurrent?'status-ongoing':isDone?'status-done':'status-upcoming'}"></div>`;
    list.appendChild(row);
  });
}

// Auto-refresh every minute
setTimeout(()=>location.reload(),60000);
</script>
</body>
</html>
